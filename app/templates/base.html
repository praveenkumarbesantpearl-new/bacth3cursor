<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Server Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-name">Server Monitor</p>
          <p class="brand-tag">Linux · read-only demo</p>
        </div>
      </div>
      <nav class="site-nav" aria-label="Main">
        <a class="nav-link is-active" href="{{ url_for('main.home') }}">Dashboard</a>
        <span class="nav-link is-disabled" title="Coming soon">Servers</span>
        <span class="nav-link is-disabled" title="Coming soon">Sign in</span>
      </nav>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>Local demo only · monitoring views are read-only</p>
    </footer>
  </div>
</body>
</html>
